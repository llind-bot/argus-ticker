name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # lets a tag build publish its Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import ticker; print(ticker.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != ticker.__version__ $v"; exit 1; }
      - name: Build ArgusTicker.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ArgusTicker
          --collect-submodules keyring.backends --collect-data tzdata run_ticker.py
      - uses: actions/upload-artifact@v4
        with:
          name: ArgusTicker-windows
          path: dist/ArgusTicker.exe
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ArgusTicker.exe --title "Argus Ticker ${GITHUB_REF_NAME#v}" --generate-notes
