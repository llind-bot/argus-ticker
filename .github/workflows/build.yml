name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # lets a tag build publish its Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import ticker; print(ticker.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != ticker.__version__ $v"; exit 1; }
      - name: Build ArgusTicker.exe
        run: |
          python packaging/version_info.py build/version_info.txt
          pyinstaller --noconfirm --onefile --windowed --name ArgusTicker --version-file build/version_info.txt --collect-submodules keyring.backends --collect-data tzdata run_ticker.py
      - uses: actions/upload-artifact@v4
        with:
          name: ArgusTicker-windows
          path: dist/ArgusTicker.exe
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ArgusTicker.exe > ArgusTicker.exe.sha256
          cat ArgusTicker.exe.sha256
          gh release create "$GITHUB_REF_NAME" ArgusTicker.exe ArgusTicker.exe.sha256 \
            --title "Argus Ticker ${GITHUB_REF_NAME#v}" --generate-notes
