name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build ArgusTicker.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ArgusTicker
          --collect-submodules keyring.backends run_ticker.py
      - uses: actions/upload-artifact@v4
        with:
          name: ArgusTicker-windows
          path: dist/ArgusTicker.exe
